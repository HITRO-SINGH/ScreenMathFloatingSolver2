name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q ScreenMathFloatingSolver-clean.zip -d project

      - name: Install Gradle 8.7
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          rm -rf "$HOME/gradle"
          mkdir -p "$HOME/gradle"
          unzip -q gradle.zip -d "$HOME/gradle"

      - name: Build debug APK
        run: |
          cd project/ScreenMathFloatingSolver-clean
          "$HOME/gradle/gradle-8.7/bin/gradle" assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: screen-math-solver-debug-apk
          path: project/ScreenMathFloatingSolver-clean/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
